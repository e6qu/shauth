name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Shauth integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce bounded GitHub Actions jobs
        run: |
          ./scripts/test-workflow-timeouts.sh
          ./scripts/check-workflow-timeouts.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.4
      - run: go test ./...
      - name: Validate Terraform module
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform test
      - run: ./scripts/check-container-publication.sh
      - run: ./scripts/test-docs-coverage.sh
      - run: ./scripts/test-stack.sh

  iac-security:
    name: IaC security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan Terraform configuration
        run: trivy config --skip-version-check --skip-dirs terraform/tests --exit-code 1 --severity HIGH,CRITICAL terraform

  validator-image:
    if: github.event_name == 'pull_request'
    name: Validator image ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layer cache is shared with publishing, so the Chromium install
      # reruns only when the Node dependencies change.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.validator
          load: true
          tags: shauth-validator:pr
          cache-from: type=gha,scope=validator-${{ matrix.architecture }}
          provenance: false
          sbom: false
      - name: Verify non-root Chromium runtime
        run: |
          test "$(docker image inspect shauth-validator:pr --format '{{.Config.User}}')" = node
          docker run --rm --entrypoint node shauth-validator:pr --input-type=module --eval \
            'import { chromium } from "playwright"; const browser = await chromium.launch({headless:true}); await browser.close();'
      - name: Verify the validator's module graph resolves in the image
        # validate.mjs runs a browser flow when imported, so its local
        # modules are loaded individually; a module missing from the image
        # fails here instead of failing every claimed job.
        run: |
          docker run --rm --entrypoint node --workdir /opt/shauth-validator shauth-validator:pr --input-type=module --eval \
            'import fs from "node:fs"; const source = fs.readFileSync("validate.mjs", "utf8"); const local = [...source.matchAll(/from "(\.\/[^"]+)"/g)].map((match) => match[1]); if (local.length === 0) throw new Error("validate.mjs imports no local modules"); for (const module of local) await import(new URL(module, "file:///opt/shauth-validator/").href); console.log(`resolved ${local.join(", ")}`);'
