name: GitHub Pages

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == vars.PAGES_DEPLOY_BRANCH
    name: Website browser gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check dependency release age before installing packages
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPENDENCY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-dependency-age.mjs "$DEPENDENCY_BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages

  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == vars.PAGES_DEPLOY_BRANCH || (vars.PAGES_DEPLOY_BRANCH == '' && github.ref_name == 'main'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
