# SPDX-License-Identifier: AGPL-3.0-or-later
name: Publish containers

# One publish at a time. The prune at the end of a run keeps only the versions
# reachable from a bare 12-hex manifest tag, and a run that has pushed its
# architecture images but not yet created that manifest has no such tag — so a
# second run's prune deletes the first run's in-flight images and its manifest
# step then fails with "<sha>-amd64: not found" while both build jobs report
# success. Three runs overlapped on 2026-08-08 and did exactly that.
#
# cancel-in-progress stays false: cancelling a publish would abandon a commit
# with no image, which is the failure this workflow exists to prevent.
concurrency:
  group: publish-containers
  cancel-in-progress: false

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-amd64:
    name: Container amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: sha
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/e6qu/shauth:${{ steps.sha.outputs.short_sha }}-amd64
          build-args: |
            SHAUTH_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.validator
          push: true
          platforms: linux/amd64
          tags: ghcr.io/e6qu/shauth-validator:${{ steps.sha.outputs.short_sha }}-amd64
          provenance: false
          sbom: false

  build-arm64:
    name: Container arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
      - id: sha
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/e6qu/shauth:${{ steps.sha.outputs.short_sha }}-arm64
          build-args: |
            SHAUTH_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.validator
          push: true
          platforms: linux/arm64
          tags: ghcr.io/e6qu/shauth-validator:${{ steps.sha.outputs.short_sha }}-arm64
          provenance: false
          sbom: false

  manifest:
    name: Container manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - run: >-
          docker buildx imagetools create
          --tag ghcr.io/e6qu/shauth:${{ needs.build-amd64.outputs.short_sha }}
          ghcr.io/e6qu/shauth:${{ needs.build-amd64.outputs.short_sha }}-amd64
          ghcr.io/e6qu/shauth:${{ needs.build-arm64.outputs.short_sha }}-arm64
      - run: >-
          docker buildx imagetools create
          --tag ghcr.io/e6qu/shauth-validator:${{ needs.build-amd64.outputs.short_sha }}
          ghcr.io/e6qu/shauth-validator:${{ needs.build-amd64.outputs.short_sha }}-amd64
          ghcr.io/e6qu/shauth-validator:${{ needs.build-arm64.outputs.short_sha }}-arm64
      - name: Verify published OCI image shape
        run: >-
          ./scripts/verify-published-container.sh
          ghcr.io/e6qu/shauth
          ${{ needs.build-amd64.outputs.short_sha }}
      - name: Verify published validator OCI image shape
        run: >-
          ./scripts/verify-published-container.sh
          ghcr.io/e6qu/shauth-validator
          ${{ needs.build-amd64.outputs.short_sha }}

  prune:
    name: Retain 20 container releases
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Delete package versions outside the newest 20 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prune-ghcr-images.sh "${{ github.repository_owner }}" "${{ github.event.repository.name }}" 20
          ./scripts/prune-ghcr-images.sh "${{ github.repository_owner }}" "shauth-validator" 20
