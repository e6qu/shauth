x-shauth-image: &shauth-image
  image: shauth-local
  build: .

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: shauth
      POSTGRES_USER: shauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shauth -d shauth"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${SHAUTH_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro

  hydra-migrate:
    <<: *shauth-image
    entrypoint: ["/hydra"]
    command: migrate sql up --read-from-env --yes
    # The image's own healthcheck probes Shauth, which this container is not.
    healthcheck:
      disable: true
    environment: &hydra-environment
      DSN: ${HYDRA_DSN:?set HYDRA_DSN}
      HYDRA_DSN: ${HYDRA_DSN:?set HYDRA_DSN}
      SHAUTH_PUBLIC_URL: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}
      HYDRA_SYSTEM_SECRET: ${HYDRA_SYSTEM_SECRET:?set HYDRA_SYSTEM_SECRET}
      # Shauth serves Hydra's public endpoints from its own origin, so that
      # origin is the issuer every relying party validates.
      URLS_SELF_ISSUER: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}
      URLS_LOGIN: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}/oauth/login
      URLS_CONSENT: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}/oauth/consent
      URLS_LOGOUT: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}/oauth/logout
      URLS_ERROR: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}/oauth/error
      URLS_POST_LOGOUT_REDIRECT: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}/signed-out
      SECRETS_SYSTEM_0: ${HYDRA_SYSTEM_SECRET:?set HYDRA_SYSTEM_SECRET}
      SQA_OPT_OUT: "true"
      # The same provider settings as production (terraform/main.tf), so the
      # stack exercises what is deployed. Every token Hydra issues, including
      # each refresh, is first confirmed by Shauth's token hook.
      STRATEGIES_ACCESS_TOKEN: jwt
      SERVE_COOKIES_SAME_SITE_MODE: Lax
      OAUTH2_TOKEN_HOOK_URL: http://shauth:8080/internal/hydra/token-hook
      OAUTH2_TOKEN_HOOK_AUTH_TYPE: api_key
      OAUTH2_TOKEN_HOOK_AUTH_CONFIG_IN: header
      OAUTH2_TOKEN_HOOK_AUTH_CONFIG_NAME: Authorization
      OAUTH2_TOKEN_HOOK_AUTH_CONFIG_VALUE: Bearer ${SHAUTH_TOKEN_HOOK_TOKEN:?set SHAUTH_TOKEN_HOOK_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  hydra:
    <<: *shauth-image
    entrypoint: ["/hydra"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gateway-integration.localhost:host-gateway"
      - "gateway-secondary.localhost:host-gateway"
      - "gateway-tertiary.localhost:host-gateway"
    command: serve all --dev --config /etc/config/hydra.yaml
    healthcheck:
      disable: true
    environment: *hydra-environment
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    ports:
      # Development settings; reachable from this machine only.
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"
    volumes:
      - ./config/hydra.yaml:/etc/config/hydra.yaml:ro

  shauth:
    <<: *shauth-image
    environment:
      SHAUTH_LISTEN_ADDRESS: :8080
      SHAUTH_PUBLIC_URL: ${SHAUTH_PUBLIC_URL:-http://localhost:8080}
      SHAUTH_ALLOW_INSECURE_COOKIES: "true"
      DATABASE_URL: ${SHAUTH_DATABASE_URL:?set SHAUTH_DATABASE_URL}
      HYDRA_ADMIN_URL: http://hydra:4445
      HYDRA_PUBLIC_INTERNAL_URL: http://hydra:4444
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      GITHUB_DEVELOPER_TEAM: e6qu-org/e6qu-org-members
      GITHUB_ADMIN_TEAM: e6qu-org/e6qu-org-admins

      SHAUTH_BOOTSTRAP_ADMIN_EMAIL: ${SHAUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost.test}
      SHAUTH_BOOTSTRAP_ADMIN_PASSWORD: ${SHAUTH_BOOTSTRAP_ADMIN_PASSWORD:?set SHAUTH_BOOTSTRAP_ADMIN_PASSWORD}
      SHAUTH_VALIDATION_USERNAME: shauth-validator
      SHAUTH_VALIDATION_EMAIL: shauth-validator@localhost.test
      SHAUTH_VALIDATOR_TOKEN: ${SHAUTH_VALIDATOR_TOKEN:?set SHAUTH_VALIDATOR_TOKEN}
      SHAUTH_VALIDATION_STATUS_TOKEN: ${SHAUTH_VALIDATION_STATUS_TOKEN:?set SHAUTH_VALIDATION_STATUS_TOKEN}
      SHAUTH_ADMIN_API_READ_TOKEN: ${SHAUTH_ADMIN_API_READ_TOKEN:-}
      SHAUTH_ADMIN_API_WRITE_TOKEN: ${SHAUTH_ADMIN_API_WRITE_TOKEN:-}
      SHAUTH_TOKEN_HOOK_TOKEN: ${SHAUTH_TOKEN_HOOK_TOKEN:?set SHAUTH_TOKEN_HOOK_TOKEN}
      SHAUTH_BOOTSTRAP_APPS_JSON: ${SHAUTH_BOOTSTRAP_APPS_JSON:-[]}
      SHAUTH_SES_REGION: eu-west-1
      SHAUTH_INVITATION_EMAIL_FROM: no-reply@localhost.test
    depends_on:
      shauth-migrate:
        condition: service_completed_successfully
      hydra:
        condition: service_started
    ports:
      - "127.0.0.1:${SHAUTH_HOST_PORT:-8080}:8080"

  shauth-migrate:
    <<: *shauth-image
    entrypoint: ["/shauth-migrate"]
    environment:
      DATABASE_URL: ${SHAUTH_DATABASE_URL:?set SHAUTH_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
